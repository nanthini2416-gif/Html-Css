<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<body bgcolor="pink">

    <center>
        <a href="#">HOME</a> &nbsp;
        <a href="Task.html">REGISTRATION</a> &nbsp;
        <a href="login.html">LOGIN</a>
        <h2>Login Form</h2>
    </center>

    <form>
        <table align="center" cellspacing="10" cellpadding="3" border="0">
            <tr>
                <td>User ID</td>
                <td><input type="text" placeholder="Enter your User ID"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter your Password"></td>
            </tr>

            <tr>
                <td>Member</td>
                <td>
                    <select>
            <option>Select</option>
            <option>Student</option>
            <option>Staff</option>
          </select>
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <input type="checkbox"> I Accept the Terms and Conditions
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="reset" value="Reset"> &nbsp;&nbsp;&nbsp;
                    <input type="submit" value="Login">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <a href="forgotpassword.html">Forgot Password?</a>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    Don’t have an account? <a href="Task.html">Create an Account</a>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
