<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
</head>
<body bgcolor="pink">

  <center>
    <a href="#">HOME</a> &nbsp;
    <a href="Task.html">REGISTRATION</a> &nbsp;
    <a href="login.html">LOGIN</a>
    <h2>Application Form</h2>
  </center>

  <form>
    <table align="center" cellspacing="10" cellpadding="3" border="0">
      <tr>
        <td>Application number</td>
        <td><input type="text" value="124"></td>
        
      </tr>

      <tr>
        <td>First name</td>
        <td><input type="text" placeholder="Enter your first name only"></td>
        <td>Last name</td>
        <td><input type="text" placeholder="Enter your last name"></td>  
      </tr>
      <tr>
        <td>Age</td>
        <td><input type="text" placeholder="Enter age"></td>
      </tr>

      <tr>
        <td>Mail ID</td>
        <td><input type="email"></td>
        <td>Confirmation mail</td>
        <td><input type="email"></td>
      </tr>

      <tr>
        <td>Mobile num</td>
        <td><input type="tel"></td>
        <td>DOB</td>
        <td><input type="date"></td>
        <td>Date In time</td>
        <td><input type="datetime-local"></td>
        <td>Gender</td>
        <td>
          <input type="radio" name="gender"> Male
          <input type="radio" name="gender"> Female
        </td>
        <td>Week</td>
        <td><input type="week"></td>
      </tr>

      <tr>
        
        
      </tr>

      <tr>
        <td>Religion</td>
        <td>
          <select>
            <option>Hindu</option>
            <option>Muslim</option>
            <option>Christian</option>
            <option>Others</option>
          </select>
        </td>
        <td>Father Name</td>
        <td><input type="text"></td>
      </tr>

      <tr>
        <td>State</td>
        <td>
          <select>
            <option>Tamilnadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
            <option>Andhra Pradesh</option>
          </select>
        </td>
        <td>District</td>
        <td>
          <select>
            <option>Chennai</option>
            <option>Madurai</option>
            <option>Coimbatore</option>
            <option>Trichy</option>
          </select>
        </td>
      </tr>

      <tr>
        <td>City</td>
        <td><input type="text"></td>
        <td>Pincode</td>
        <td><input type="number"></td>
      </tr>

      <tr>
        <td>Address 1</td>
        <td><textarea rows="3" cols="25"></textarea></td>
        <td>Address 2</td>
        <td><textarea rows="3" cols="25"></textarea></td>
      </tr>

      <tr>
        <td>Aadhar</td>
        <td><input type="file"></td>
        <td>Photo</td>
        <td><input type="file"></td>
      </tr>

      <tr>
        
        <td colspan="2">
          <input type="checkbox"> I Accept the Terms And Conditions
        </td>
      </tr>

      <tr>
        <td colspan="4" align="center">
          <input type="reset" value="Reset">
          &nbsp;&nbsp;&nbsp;
          <input type="submit" value="Submit">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
