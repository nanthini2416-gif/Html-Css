<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<body bgcolor="pink">

    <center>
        <a href="#">HOME</a> &nbsp;
        <a href="Task.html">REGISTRATION</a> &nbsp;
        <a href="login.html">LOGIN</a>
        <h2>Forgot Password</h2>
    </center>

    <form>
        <table align="center" cellspacing="10" cellpadding="3" border="0">
            <tr>
                <td>Username</td>
                <td><input type="text" placeholder="Enter your username"></td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Mobile Number</td>
                <td><input type="tel" placeholder="Enter your mobile number"></td>
            </tr>

            <tr>
                <td>Mail ID</td>
                <td><input type="email" placeholder="Enter your registered mail ID"></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="reset" value="Reset"> &nbsp;&nbsp;&nbsp;
                    <input type="submit" value="Send Mail">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <a href="login.html">Back to Login</a>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
