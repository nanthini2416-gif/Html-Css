<!DOCTYPE html>
<html lang="en">

    <title>Simple table</title>
</head>

<body>

            <th>Age</th>
            <th>City</th>

        <tr>
            <td>Nanthini</td>
            <td>28</td>
            <td>Rameswaram</td>
        </tr>
        <tr>
            <td>Abimanyu</td>
            <td>4</td>
            <td>Madurai</td>
        </tr>
        <tr>
            <td>Nila</td>
            <td>1</td>
            <td>Tcm</td>
        </tr>


    </table>
</body>

</html>
